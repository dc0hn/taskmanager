<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almanac — calendar &amp; task scheduler</title>
    <meta name="color-scheme" content="dark" />
    <!-- No remote fonts: the sans stack resolves to the system SF Pro and the
         mono stack to SF Mono on macOS, so the app makes zero network calls.
         The inline background matches the Tauri window colour so there is no
         white flash between the window opening and React mounting. -->
    <style>
      html,
      body {
        background: #0b0d12;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
